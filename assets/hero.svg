<style>
.nav{font:500 15px 'JetBrains Mono', Consolas, 'SFMono-Regular', Menlo, monospace;letter-spacing:3px;fill:#fdfdfd}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 2.4s cubic-bezier(.22,1,.36,1) .2s forwards}
.k{opacity:0;animation:pop .6s ease forwards}
.head{animation:play 9s linear infinite}
.name{font:900 92px Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;letter-spacing:-3px;fill:#fdfdfd}
.role{font:500 18px 'JetBrains Mono', Consolas, 'SFMono-Regular', Menlo, monospace;letter-spacing:3.5px;white-space:pre;fill:#7ba6e8}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pop{to{opacity:1}}
@keyframes play{from{transform:translateX(0)}to{transform:translateX(1200px)}}
@media (prefers-reduced-motion:reduce){.draw{stroke-dashoffset:0;animation:none}.k{opacity:1;animation:none}.head{animation:none}}
</style>
